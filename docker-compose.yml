  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - persea-net
    restart: on-failure

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - persea-net
    restart: on-failure

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: recommendation-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - persea-net
    restart: on-failure

volumes:
  pgdata-keycloak:
  pgdata:

networks:
  persea-net:
    driver: bridge
